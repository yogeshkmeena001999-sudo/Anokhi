<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anokhi Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; color: #1a1a1a; }
    header { background: #10b981; color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #eee; margin-bottom: 10px; }
    .category { font-size: 0.72rem; color: #10b981; font-weight: 600; text-transform: uppercase; }
    .title { font-size: 0.95rem; font-weight: 600; margin: 4px 0; }
    .unit { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .price { font-weight: 700; font-size: 1rem; }
    .mrp { font-size: 0.78rem; color: #999; text-decoration: line-through; margin-left: 4px; }
    .btn { background: #ecfdf5; color: #059669; border: 1px solid #10b981; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .btn:active { background: #10b981; color: white; }
    .empty { text-align: center; padding: 40px 20px; color: #666; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <header>
    <h1>Anokhi</h1>
    <span id="cart-count">Cart: 0</span>
  </header>

  <div class="container">
    <div id="product-grid" class="grid">
      <div class="empty">Loading products...</div>
    </div>
  </div>

  <script>
    let cartCount = 0;

    function addToCart(name) {
      cartCount++;
      document.getElementById('cart-count').textContent = `Cart: ${cartCount}`;
      alert(`${name} added to cart!`);
    }

    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const res = await fetch('/api/products');
        const data = await res.json();

        if (!data.success || !data.products || data.products.length === 0) {
          grid.innerHTML = '<div class="empty">No products available right now. Add products to your database to see them here!</div>';
          return;
        }

        grid.innerHTML = data.products.map(p => `
          <div class="card">
            <div>
              <img src="${p.image_url || 'https://placehold.co/300x200?text=Anokhi'}" alt="${p.name}" />
              <div class="category">${p.category}</div>
              <div class="title">${p.name}</div>
              <div class="unit">${p.unit_label}</div>
            </div>
            <div class="price-row">
              <div>
                <span class="price">₹${p.selling_price}</span>
                ${p.mrp > p.selling_price ? `<span class="mrp">₹${p.mrp}</span>` : ''}
              </div>
              <button class="btn" onclick="addToCart('${p.name.replace(/'/g, "\\'")}')">ADD</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="empty">Failed to load products. Please try again later.</div>';
      }
    }

    loadProducts();
  </script>

</body>
</html>
