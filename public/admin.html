<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anokhi Admin Panel</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f6f8; padding: 16px; color: #1a1a1a; }
    .box { max-width: 480px; margin: 0 auto 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; margin-bottom: 14px; color: #10b981; font-size: 1.2rem; }
    input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:active { background: #059669; }
    .link { display: block; text-align: center; margin-top: 10px; color: #10b981; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <!-- Cloud Auto-Sync Box -->
  <div class="box" style="border: 2px solid #10b981;">
    <h2>⚡ Auto-Connect Cloud Stores & Catalog</h2>
    <p style="font-size: 0.85rem; color: #555; margin-bottom: 10px;">
      Paste any Cloud JSON Feed URL (GitHub Raw, AWS S3, Firebase, or Partner API) to automatically import all stores and products.
    </p>
    <form id="cloud-sync-form">
      <input type="url" id="feed_url" placeholder="https://example.com/stores-catalog.json" required />
      <button type="submit">Sync Stores & Products Automatically</button>
    </form>
  </div>

  <!-- Box 1: Add Store -->
  <div class="box">
    <h2>1. Add a Store</h2>
    <form id="store-form">
      <input type="text" id="store_name" placeholder="Store Name (e.g. Sharma General Store)" required />
      <input type="text" id="store_address" placeholder="Area / Address (e.g. Malviya Nagar)" required />
      <input type="text" id="store_city" placeholder="City (e.g. Jaipur)" required />
      <button type="submit">Save Store</button>
    </form>
  </div>

  <!-- Box 2: Add Product -->
  <div class="box">
    <h2>2. Add Product to a Store</h2>
    <form id="product-form">
      <select id="store_select" required>
        <option value="">-- Select Store --</option>
      </select>
      <input type="text" id="sku" placeholder="Unique Code / SKU (e.g. ITEM-001)" required />
      <input type="text" id="name" placeholder="Product Name (e.g. Amul Taaza Milk)" required />
      <input type="text" id="category" placeholder="Category (e.g. Dairy, Grocery, Snacks)" required />
      <input type="text" id="unit_label" placeholder="Pack Size (e.g. 1 Litre, 500g, 1 Pc)" required />
      <input type="number" step="0.01" id="mrp" placeholder="MRP ₹ (e.g. 34)" required />
      <input type="number" step="0.01" id="selling_price" placeholder="Your Selling Price ₹ (e.g. 32)" required />
      <input type="url" id="image_url" placeholder="Product Image Link (optional)" />
      <button type="submit">Add Product to Store</button>
    </form>
    <a href="/" class="link">View Live Storefront →</a>
  </div>

  <script>
    async function loadStores() {
      const res = await fetch('/api/stores');
      const data = await res.json();
      const select = document.getElementById('store_select');
      select.innerHTML = '<option value="">-- Select Store --</option>';
      if (data.success && data.stores) {
        data.stores.forEach(store => {
          const opt = document.createElement('option');
          opt.value = store.id;
          opt.textContent = `${store.name} (${store.city || ''})`;
          select.appendChild(opt);
        });
      }
    }

    document.getElementById('store-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('store_name').value,
        address: document.getElementById('store_address').value,
        city: document.getElementById('store_city').value
      };
      const res = await fetch('/api/stores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        alert('Store saved!');
        e.target.reset();
        loadStores();
      } else {
        alert('Error: ' + data.error);
      }
    });

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const storeId = document.getElementById('store_select').value;
      const payload = {
        store_id: parseInt(storeId),
        sku: document.getElementById('sku').value,
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        unit_label: document.getElementById('unit_label').value,
        mrp: parseFloat(document.getElementById('mrp').value),
        selling_price: parseFloat(document.getElementById('selling_price').value),
        image_url: document.getElementById('image_url').value
      };
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        alert('Product added to your live store!');
        document.getElementById('sku').value = '';
        document.getElementById('name').value = '';
        document.getElementById('unit_label').value = '';
        document.getElementById('mrp').value = '';
        document.getElementById('selling_price').value = '';
        document.getElementById('image_url').value = '';
      } else {
        alert('Error: ' + data.error);
      }
    });

    loadStores();
  </script>
</body>
</html>
